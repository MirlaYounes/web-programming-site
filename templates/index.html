{% extends "base.html" %}

{% block title %}
Home
{% endblock %}

{% block content %}

<section>
    <h2>Weekly Work</h2>

    <!-- Each week you add a link here to that week's page or feature. -->
    <ul>
        {% for item in weekly_work %}
            <li>
                <a href="{{ item.url }}">
                    Week {{ item.week }} — {{ item.title }}
                </a>
            </li>
        {% else %}
            <li>Week 1 — live site launched.</li>
        {% endfor %}
    </ul>
</section>

{% endblock %}
