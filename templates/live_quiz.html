{% extends "base.html" %}
{% block title %}Live Quiz{% endblock %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='quiz.css') }}" />
{% endblock %}

{% block nav %}{% endblock %}

{% block content %}
<main class="container">
  <h1>Live JavaScript Quiz</h1>

  <p id="loading">Loading quiz...</p>
  <p id="error" role="alert" hidden></p>

  <section id="quizPanel" style="display: none;">
    <p id="progress"></p>
    <h2 id="questionText"></h2>
    <div id="choices"></div>

    <div class="navigation">
      <button id="firstBtn" type="button" onclick="goFirst()">First</button>
      <button id="previousBtn" type="button" onclick="goPrevious()">Previous</button>
      <button id="nextBtn" type="button" onclick="goNext()">Next</button>
      <button id="lastBtn" type="button" onclick="goLast()">Last</button>
    </div>

    <button id="submitBtn" class="submit" type="button" onclick="submitQuiz()">
      Submit Quiz
    </button>
  </section>

  <section id="resultsPanel" style="display: none;">
    <h2>Quiz Results</h2>
    <p id="scoreText"></p>
    <p id="percentageText"></p>
    <p id="performanceText"></p>
    <h3>Correction</h3>
    <pre id="correction"></pre>
  </section>
</main>

<script src="{{ url_for('static', filename='live_quiz.js') }}"></script>

<script>
/* ---------- Answer cards move away from the cursor ---------- */
document.addEventListener("mousemove", (e) => {
  const RADIUS = 140;
  const STRENGTH = 10;

  document.querySelectorAll(".choice").forEach((card) => {
    const rect = card.getBoundingClientRect();
    const dx = rect.left + rect.width / 2 - e.clientX;
    const dy = rect.top + rect.height / 2 - e.clientY;
    const dist = Math.hypot(dx, dy);

    if (dist < RADIUS && dist > 0) {
      const force = (1 - dist / RADIUS) * STRENGTH;
      card.style.setProperty("--push-x", (dx / dist) * force + "px");
      card.style.setProperty("--push-y", (dy / dist) * force + "px");
    } else {
      card.style.setProperty("--push-x", "0px");
      card.style.setProperty("--push-y", "0px");
    }
  });
});
</script>
{% endblock %}
